  faq:
    who_am_i:
      question1: Хто ви і які послуги надаєте?
      answer1_1: Ми — RubyCoin, невелика студія, яка робить продукти на Ruby on Rails і супроводжує їх роками.
      answer1_2: Ще ми пишемо україномовні навчальні матеріали — інструкції та уроки, зокрема з програмування.
      answer1_3: А також розробляємо сайти для практичного навчання й зберігання цих матеріалів — як-от цей.
      more_info1_html: Познайомитися з нами ближче можна в нашому <a href="https://t.me/rubychatua" target="_blank" rel="noreferrer">Telegram-чаті</a>.
    services:
      question2: Які послуги ви надаєте для початківців?
      answer2_1: Навчальні матеріали з Ruby та Ruby on Rails — уроки, які пишемо самі, і джерела, за якими вчилися.
      more_info2: Наша мета — допомогти новачкам засвоїти основи цих технологій і набути практичного досвіду.
    collaboration:
      question3: Чи можна долучитися на практику до ваших проєктів?
      answer3_1: Так.
      more_info3: Якщо у вас достатньо бажання й цілеспрямованості, ми охоче допоможемо.
    consultation:
      question4: Чи надаєте ви консультації або менторство?
      answer4_1: Так, ми пропонуємо менторство й консультації — після попереднього знайомства, у Discord.
      answer4_2_1_html: На запитання про Ruby та Ruby on Rails ми відповідаємо й допомагаємо з задачами у міру можливості — у нашій <a href="https://t.me/rubychatua" target="_blank" rel="noreferrer">Telegram-групі</a>.
      more_info4: Тим, хто успішно пройде стажування, ми пропонуємо першу роботу в цій галузі.
    communication:
      question5: Як можна зв’язатися з вами для отримання додаткової інформації чи консультації?
      answer5_1: Ви можете зв’язатися з нами через LinkedIn або Telegram.
      more_info5: Посилання ви знайдете внизу сторінки.
    price:
      question6: Чи платні ваші послуги?
      answer6_1: Наші навчальні матеріали на цьому сайті доступні безкоштовно.
      more_info6: Менторство ми також надаємо безкоштовно — у міру вільного часу.

