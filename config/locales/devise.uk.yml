uk:
  devise:
    confirmations:
      confirmed: Вашу електронну адресу успішно підтверджено.
      send_instructions: За кілька хвилин ви отримаєте електронний лист із інструкціями щодо того, як підтвердити свою адресу електронної пошти
      send_paranoid_instructions: Якщо ваша електронна адреса існує в нашій базі даних, ви отримаєте електронний лист з інструкціями щодо того, як підтвердити свою адресу електронної пошти за кілька хвилин.
    failure:
      already_authenticated: Ви вже ввійшли.
      inactive: Ваш обліковий запис ще не активовано.
      invalid: 'Недійсний %{authentication_keys} або пароль.'
      locked: Ваш обліковий запис заблоковано.
      last_attempt: У вас є ще одна спроба, перш ніж ваш обліковий запис буде заблоковано.
      not_found_in_database: 'Недійсний %{authentication_keys} або пароль.'
      timeout: Ваш сеанс закінчився. Будь ласка, увійдіть знову, щоб продовжити.
      unauthenticated: Вам потрібно ввійти або зареєструватися, перш ніж продовжити.
      unconfirmed: Ви повинні підтвердити свою електронну адресу, перш ніж продовжити.
    mailer:
      confirmation_instructions:
        subject: Інструкції з підтвердження
      reset_password_instructions:
        subject: Інструкції щодо скидання пароля
        greeting: Вітаємо, %{recipient}!
        instruction: Хтось запросив посилання для зміни вашого пароля. Зробити це можна за посиланням нижче.
        action: Змінити пароль
        instruction_2: Якщо ви цього не запитували, просто проігноруйте цей лист.
        instruction_3: Ваш пароль не зміниться, доки ви не перейдете за посиланням вище й не створите новий.
      unlock_instructions:
        subject: Інструкції з розблокування
      email_changed:
        subject: Електронна адреса змінена
        greeting: Вітаємо, %{recipient}!
        message: Повідомляємо, що вашу електронну адресу змінено на %{email}.
        message_unconfirmed: Повідомляємо, що вашу електронну адресу буде змінено на %{email}.
      password_change:
        subject: Пароль змінено
        greeting: Вітаємо, %{recipient}!
        message: Повідомляємо, що ваш пароль було змінено.
    omniauth_callbacks:
      failure: 'Не вдалося автентифікувати вас від %{kind} через \%{reason}\.'
      success: 'Успішно автентифіковано з облікового запису %{kind}.'
    passwords:
      no_token: Ви не можете отримати доступ до цієї сторінки, не перейшовши з електронного листа для зміни пароля. Якщо ви перейшли з електронного листа для зміни пароля, переконайтеся, що ви використали повну надану URL-адресу.
      send_instructions: За кілька хвилин ви отримаєте електронний лист з інструкціями щодо скидання пароля.
      send_paranoid_instructions: Якщо ваша електронна адреса існує в нашій базі даних, ви отримаєте посилання для відновлення пароля на свою електронну адресу за кілька хвилин.
      updated: Ваш пароль успішно змінено. Ви ввійшли.
      updated_not_active: Ваш пароль успішно змінено.
      edit:
        title: Змінити пароль
        new_password: Новий пароль
        confirm_password: Підтвердити новий пароль
        minimum: "мінімум %{count} символів"
        submit: Змінити пароль
    registrations:
      closed: "Реєстрація на цьому сайті закрита. Якщо акаунт твій — увійди."
      destroyed: До побачення! Ваш обліковий запис успішно скасовано. Сподіваємося, що незабаром знову побачимося.
      signed_up: Ласкаво просимо! Ви успішно зареєструвалися.
      signed_up_but_inactive: Ви успішно зареєструвалися. Однак ми не змогли ввійти, оскільки ваш обліковий запис ще не активовано.
      signed_up_but_locked: Ви успішно зареєструвалися. Однак ми не змогли ввійти, оскільки ваш обліковий запис заблоковано.
      signed_up_but_unconfirmed: На вашу адресу електронної пошти надіслано повідомлення з посиланням для підтвердження. Перейдіть за посиланням, щоб активувати обліковий запис.
      update_needs_confirmation: Ви успішно оновили свій обліковий запис, але нам потрібно підтвердити вашу нову електронну адресу. Перевірте електронну пошту та перейдіть за посиланням для підтвердження, щоб підтвердити нову електронну адресу.
      updated: Ваш обліковий запис успішно оновлено.
      updated_but_not_signed_in: Ваш обліковий запис успішно оновлено, але оскільки ваш пароль було змінено, вам потрібно ввійти знову.
      edit:
        confirm_notice: (потрібний для підвердження змін)
        leave_blank: (залиште пустим якщо не бажаєте змінювати)
        waiting_confirm: Очікується підвердження для
      new:
        password_length: (мінімум %{length} символів)
    sessions:
      signed_in: Вхід успішно виконано.
      signed_out: Вихід успішно виконано.
      already_signed_out: Вихід успішно виконано.
    unlocks:
      send_instructions: За кілька хвилин ви отримаєте електронний лист з інструкціями щодо того, як розблокувати свій обліковий запис.
      send_paranoid_instructions: Якщо ваш обліковий запис існує, ви отримаєте електронний лист з інструкціями щодо його розблокування за кілька хвилин.
      unlocked: Ваш обліковий запис успішно розблоковано. Увійдіть, щоб продовжити.
  errors:
    messages:
      already_confirmed: вже підтверджено, спробуйте ввійти
      confirmation_period_expired: 'потрібно підтвердити протягом %{period}, будь ласка, подайте новий запит'
      expired: термін дії закінчився, будь ласка, надішліть запит на новий
      not_found: не знайдено
      not_locked: не був заблокований
      not_saved:
        one: '%{count} помилка заборонила зберегти цей %{resource}:'
        few: '%{count} помилки заборонили зберегти цей %{resource}:'
        many: '%{count} помилок заборонили зберегти цей %{resource}:'
        other: '%{count} помилки заборонили зберегти цей %{resource}:'
