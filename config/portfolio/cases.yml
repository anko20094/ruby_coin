          uk: "20,5%"
        label:
          en: "of the live application code is still mine"
          uk: "живого коду застосунку досі мій"
    plain:
      heading:
        en: "A realtor’s whole business is people who forgot them"
        uk: "Увесь бізнес ріелтора — це люди, які про нього забули"
      body:
        - en: "A US realtor lives on repeat business: the person you sold a house to will sell it again in five to seven years, and refinance twice in between. By then the client has forgotten you exist."
          uk: "Американський ріелтор живе з повторних угод: людина, якій ти продав будинок, продасть його знову через 5–7 років і двічі рефінансує іпотеку між тим. На той момент клієнт уже не пам’ятає, що ти існуєш."
        - en: "This service is the platform’s intelligence layer. It ingests every recorded sale and mortgage in the country over eight years of history and turns that into something an agent can act on: who is selling in their area, who they compete with, who they should partner with — and which of their own past clients just did a deal through somebody else."
          uk: "Цей сервіс — аналітичний шар платформи. Він завантажує всі зареєстровані угоди й іпотеки країни за вісім років історії й перетворює це на те, з чим агент може працювати: хто продає в його районі, з ким він конкурує, з ким варто партнеритися — і хто з його власних колишніх клієнтів щойно зробив угоду через когось іншого."
        - en: "Two facts make it hard. The data arrives dirty, from dozens of government registries, MLS databases and paid providers, in different shapes and with the same person spelled five ways. And every external lookup costs real money, so the system has to remember what it already knows."
          uk: "Складність у двох речах. Дані приходять брудними — з державних реєстрів, MLS-баз і платних провайдерів, у різних форматах, де одну людину записано п’ятьма способами. І кожен зовнішній запит коштує реальні гроші, тож система мусить пам’ятати те, що вже знає."
    mine:
      - en: "<b>The service’s public API</b> — agent transactions, statistics, partnership overview, potential listings, lost deals — with a documented spec in every pull request."
        uk: "<b>Публічне API сервісу</b> — угоди агента, статистика, огляд партнерств, потенційні продавці, втрачені угоди — із документованою специфікацією в кожному PR."
      - en: "<b>Lost Deals</b>: the product that shows an agent the clients who sold or refinanced without them. Money they did not earn — and the strongest argument for renewing a subscription."
        uk: "<b>Lost Deals</b>: продукт, який показує агенту клієнтів, що продали або рефінансувалися повз нього. Прямі недоотримані гроші — і найсильніший аргумент платити далі."
      - en: "<b>Three years teaching it that two “John Smiths” are one person.</b> A wrong merge makes every ranking lie, so this was the highest-stakes work in the domain."
        uk: "<b>Три роки вчив систему, що двоє «Джонів Смітів» — одна людина.</b> Неправильне склеювання ламає всі рейтинги, тож ціна помилки тут найвища в домені."
      - en: "<b>Kept it fast as history reached eight years:</b> partitioned the largest tables, split reads from writes in live traffic. Users noticed nothing, which was the point."
        uk: "<b>Тримав швидкість, коли історії стало вісім років:</b> партиціював найбільші таблиці, розвів читання й запис у живому трафіку. Користувачі не помітили нічого — у цьому й був сенс."
    engineering:
      heading:
        en: "Entity resolution, ETL, and PostgreSQL that had to stop growing sideways"
        uk: "Entity resolution, ETL і PostgreSQL, який мусив перестати рости боком"
      sub:
        en: "32 tables plus 80 partitions — 60 of them by year — 617 indexes, 62 documented API operations."
        uk: "32 таблиці плюс 80 партицій — 60 із них по роках, — 617 індексів, 62 документовані API-операції."
      items:
        - title:
            en: "Entity resolution · the long war (35+ PRs)"
            uk: "Entity resolution · довга війна (35+ PR)"
          body:
            en: "Three matching strategies in priority order — licence number → name + phone → name + company — with <b>BFS expansion of duplicate groups</b>, batched <code>upsert_all</code>, a 128 MB cache, and <b>resumable progress</b> so a multi-hour run restarts where it stopped. Fuzzy name matching is raw SQL on <code>pg_trgm</code>: <code>similarity ≥ 0.6</code> intersected with JSONB phone arrays via <code>?|</code>."
            uk: "Три стратегії матчингу з пріоритетом — номер ліцензії → ім’я + телефон → ім’я + компанія — з <b>BFS-розкриттям груп дублікатів</b>, батчевим <code>upsert_all</code>, кешем на 128 МБ і <b>resumable-прогресом</b>, щоб багатогодинний прогін продовжився з місця зупинки. Нечіткий матчинг імен — сирий SQL на <code>pg_trgm</code>: <code>similarity ≥ 0.6</code> у перетині з JSONB-масивами телефонів через <code>?|</code>."
        - title:
            en: "Then the same problem, vectorised"
            uk: "Та сама задача, але у векторах"
          body:
            en: "My largest pull request here — 3 645 hand-written lines — replaced an LLM-per-request approach with <b>768-dimension embeddings on pgvector + HNSW</b>, building a “profile sentence” per realtor out of names, companies, cities and ZIPs. <b>Stated honestly:</b> merged behind a feature flag, then reworked out and dropped from the schema in September 2025 — it never carried production load."
            uk: "Мій найбільший PR у проєкті — 3 645 рукописних рядків — замінив підхід «LLM на кожен запит» на <b>768-вимірні embeddings на pgvector + HNSW</b>, із генерацією «профільного речення» ріелтора з імен, компаній, міст і ZIP. <b>Чесно:</b> змерджено за feature-флагом, а у вересні 2025 переписано інакше й прибрано зі схеми — воно так і не тримало продакшн-навантаження."
        - title:
            en: "PostgreSQL under load"
            uk: "PostgreSQL під навантаженням"
          body:
            en: "<b>RANGE partitioning</b> of the month-stats tables, plus the 2025 and 2026 year partitions on sales and loans — the original sales/loans conversion was a colleague’s. <b>Read/write splitting in production traffic</b> via <code>connects_to</code>: roles wired up, the database selector placed correctly in the middleware stack, and the writing role forced at the exact points where read-after-write broke. 3 619 lines across four merged commits."
            uk: "<b>RANGE-партиціювання</b> місячних агрегатів, а також партиції 2025 і 2026 років для угод та іпотек — початкове переведення угод і іпотек робив колега. <b>Розведення читання й запису в продовому трафіку</b> через <code>connects_to</code>: роли, правильне місце селектора в middleware-стеку і точковий примус <code>writing</code> там, де ламався read-after-write. 3 619 рядків у чотирьох змерджених комітах."
        - title:
            en: "A new data supplier, end to end"
            uk: "Нове джерело даних, наскрізно"
          body:
            en: "A pipeline built from nothing for a new market-data feed: S3 download → parse → validate → batched upsert → merge into existing sales, guarding against overwriting co-listing data. Three large PRs of 2.4–3.1k lines, plus a three-level fallback matcher for agent contacts."
            uk: "Пайплайн з нуля під нового постачальника ринкових даних: завантаження з S3 → парсинг → валідація → батчевий upsert → мерджинг із наявними угодами із захистом від перезапису co-listing. Три великі PR по 2.4–3.1 тис. рядків, плюс трирівневий фолбек-матчинг контактів агентів."
        - title:
            en: "Search that got smaller"
            uk: "Пошук, який поменшав"
          body:
            en: "OpenSearch filters, sorting and relevance for agent search. Reindexing moved off model callbacks onto a queue with a periodic job, and an OOM during bulk reindex fixed by changing mode and throttling. One search PR deleted <b>7 919 lines</b>, of which 7 131 were recorded HTTP cassettes: simplification, not accumulation."
            uk: "Фільтри, сортування й релевантність пошуку агентів на OpenSearch. Реіндексацію знято з колбеків моделі на чергу з періодичною джобою, а OOM під масовою реіндексацією полікувано зміною режиму й тротлінгом. Один PR по пошуку видалив <b>7 919 рядків</b>, із яких 7 131 — записані HTTP-касети: спрощення, а не накопичення."
        - title:
            en: "Scoring, and knowing when not to pay for it"
            uk: "Скоринг — і коли за нього не платити"
          body:
            en: "External move-probability scoring behind my own <code>Pipelines / Providers / Sources</code> abstraction, backfilled in the background, then exposed as dashboard filters and sorting. Outside production the provider is swapped for a random one, so the paid quota is never burned by a test run."
            uk: "Зовнішній скоринг імовірності переїзду за власною абстракцією <code>Pipelines / Providers / Sources</code>, фонове довантаження, далі — фільтри й сортування в дашборді. Поза продакшном провайдер підмінений на випадковий, тож платна квота не згорає на тестових прогонах."
    quality:
      - value:
          en: "272"
          uk: "272"
        label:
          en: "pull requests merged"
          uk: "змерджених PR"
      - value:
          en: "184"
          uk: "184"
        label:
          en: "tickets closed end to end"
          uk: "тікетів закрито наскрізно"
      - value:
          en: "91.9%"
          uk: "91,9%"
        label:
          en: "of my PRs touch specs"
          uk: "моїх PR чіпають тести"
      - value:
          en: "62"
          uk: "62"
        label:
          en: "documented API operations"
          uk: "документованих API-операцій"
    scope_note:
      en: "<b>Scope, honestly.</b> Helm charts, Dockerfiles and CI pipelines were owned by dedicated people on this platform — I worked inside a Kubernetes/CircleCI environment rather than building it. My contribution is applied backend and data work. Every number here is counted from git history, at my last commit in February 2026."
      uk: "<b>Про межі — чесно.</b> Helm-чарти, Dockerfile і CI-пайплайни на цій платформі належали окремим людям — я працював у Kubernetes/CircleCI-оточенні, а не будував його. Мій внесок — прикладний бекенд і робота з даними. Усі цифри порахувані з git-історії станом на мій останній коміт у лютому 2026-го."
  - slug: "dna"
    mark: "02"
    own: true
    year:
      en: "2023—2026"
      uk: "2023—2026"
    sector:
      en: "content automation"
      uk: "автоматизація контенту"
    status:
      en: "built from zero · team up to 6"
      uk: "з нуля · команда до 6"
    title:
      en: "DNA"
      uk: "DNA"
    tagline:
      en: "A media business runs dozens of Telegram channels. This platform runs them for it — collecting, cleaning, rewriting, scheduling, publishing and billing, unattended."
      uk: "Медіабізнес веде десятки Telegram-каналів. Ця платформа веде їх за нього — збирає, чистить, переписує, планує, публікує й білить, без наглядача."
    role:
      en: "Tech lead · architect · PM · devops"
      uk: "Tech lead · архітектор · PM · devops"
    stack:
      - "Rails 8.1 · Ruby 3.4"
      - "PostgreSQL 18"
      - "TDLib / MTProto"
      - "pgvector · HNSW"
      - "Sidekiq 8 · Redis"
      - "pgbouncer"
      - "systemd · Capistrano"
    metrics:
      - value:
          en: "33M+"
          uk: "33 млн+"
        label:
          en: "combined reach of managed channels"
          uk: "сукупний охват керованих каналів"
      - value:
          en: "10k+"
          uk: "10 тис.+"
        label:
          en: "platform customers"
          uk: "клієнтів платформи"
      - value:
          en: "~23k"
          uk: "~23 тис."
        label:
          en: "posts through the pipeline daily"
          uk: "постів через пайплайн щодня"
      - value:
          en: "×20"
          uk: "×20"
        label:
          en: "customer growth in 14 months"
          uk: "зростання клієнтів за 14 місяців"
    plain:
      heading:
        en: "By hand this is not hard — it is impossible"
        uk: "Руками це не складно — це неможливо"
      body:
        - en: "Thousands of media businesses live inside Telegram. One owner may hold dozens of channels and has to feed every one of them every day: find material, strip out somebody else’s ads, rewrite the text, schedule the post, greet new subscribers, sell ad slots, count the money."
          uk: "Тисячі медіабізнесів живуть у Telegram. Один власник може тримати десятки каналів і мусить щодня наповнювати кожен: знайти матеріал, вичистити чужу рекламу, переписати текст, поставити пост у розклад, привітати нових підписників, продати рекламні слоти, порахувати гроші."
        - en: "The owner connects their channels and sources once, sets the rules, and the platform takes over: around the clock, weekends included, with nobody at the console. Each customer even gets their own branded bot, created and maintained by the platform itself."
          uk: "Власник один раз підключає канали й джерела, задає правила — і платформа перебирає роботу на себе: круглу добу, включно з вихідними, без людини за консоллю. Кожен клієнт навіть отримує власного брендованого бота, якого платформа створює й обслуговує сама."
        - en: "<b>Why it is genuinely hard.</b> Telegram has no official API for this. The platform keeps a fleet of 61 real accounts on the low-level protocol — and Telegram can ban any of them for behaving oddly. So most of the engineering is not “ship a feature”, it is “do not break”: rate budgets, fingerprint separation, ban handling, session recovery — the system heals itself while the owner sleeps."
          uk: "<b>Чому це справді складно.</b> В Telegram немає офіційного API для такого. Платформа тримає парк із 61 живого акаунта на низькорівневому протоколі — і Telegram може забанити будь-який за дивну поведінку. Тож більшість інженерії тут — не «зробити фічу», а «не зламатися»: бюджети частоти, розділення відбитків, обробка банів, відновлення сесій — система лікує себе, поки власник спить."
    mine:
      - en: "<b>Designed and built the platform from zero</b> — architecture, product decisions, the roadmap, and 90% of merge commits."
        uk: "<b>Спроєктував і побудував платформу з нуля</b> — архітектура, продуктові рішення, роадмап і 90% merge-комітів."
      - en: "<b>Led a team of up to six</b> and owned 93% of production releases — 429 deploys."
        uk: "<b>Вів команду до шести людей</b> і випустив 93% продових релізів — 429 деплоїв."
      - en: "<b>Ran the platform migrations personally:</b> Python/Pyrogram → Ruby/TDLib, Rails 7.2 → 8.1, PostgreSQL 16 → 18."
        uk: "<b>Провів платформні міграції особисто:</b> Python/Pyrogram → Ruby/TDLib, Rails 7.2 → 8.1, PostgreSQL 16 → 18."
      - en: "<b>Built the billing and the per-customer bot factory</b> — the part that turns a tool into a business."
        uk: "<b>Зробив біллінг і фабрику ботів під кожного клієнта</b> — те, що перетворює інструмент на бізнес."
    engineering:
      heading:
        en: "A headless monolith with five routes and a self-healing userbot fleet"
        uk: "Headless-моноліт на п’ять роутів і userbot-парк, який лікує себе"
      sub:
        en: "200k lines of Ruby across 1,100+ service objects and 45 tables, with roughly two lines of test for every line of code."
        uk: "200 тис. рядків Ruby у 1 100+ сервісних об’єктах і 45 таблицях, і майже два рядки тесту на кожен рядок коду."
      items:
        - title:
            en: "Headless monolith"
            uk: "Headless-моноліт"
          body:
            en: "No views, no JS build, no REST API — <b>five routes total</b>. The whole admin and user panel is a state machine inside Telegram: 200k lines of Ruby, 1,100+ service objects, 45 tables."
            uk: "Ні в’юшок, ні JS-білду, ні REST API — <b>усього п’ять роутів</b>. Уся адмінка й панель користувача — це стейт-машина всередині Telegram: 200 тис. рядків Ruby, 1 100+ сервісних об’єктів, 45 таблиць."
        - title:
            en: "Two delivery pipelines"
            uk: "Два пайплайни доставки"
          body:
            en: "Live mirroring (listener → clone per channel → autopost) and cursor-based drip backfill through source history. They receive differently-shaped data, so every capture bug is verified in both."
            uk: "Живе дзеркалення (слухач → клон на канал → автопост) і крапельний backfill історії джерела за курсором. Вони отримують дані різної форми, тож кожен баг захоплення перевіряється в обох."
        - title:
            en: "Userbot fleet on native TDLib"
            uk: "Userbot-парк на нативному TDLib"
          body:
            en: "Two sessions per account — one reads, one acts — all listeners under one supervisor with a reconciler that picks up new accounts without a restart. Join budgets, per-account device fingerprints, flood-wait pacing, membership reconciliation."
            uk: "Дві сесії на акаунт — одна читає, друга діє — усі слухачі під одним супервізором із реконсилером, що підхоплює нові акаунти без рестарту. Бюджети вступів, відбитки пристроїв на акаунт, витримка flood-wait, звірка членства."
        - title:
            en: "Semantic dedup & ad detection"
            uk: "Семантична дедуплікація й детект реклами"
          body:
            en: "<b>1536-dim embeddings inline in the content table</b> with an HNSW index; per-channel AI prompts composed at runtime from JSONB, so tuning needs no deploy."
            uk: "<b>1536-вимірні embeddings прямо в таблиці контенту</b> з HNSW-індексом; AI-промпти на канал збираються в рантаймі з JSONB, тож тюнінг не потребує деплою."
        - title:
            en: "Incidents worth reading"
            uk: "Інциденти, які варто прочитати"
          body:
            en: "FD exhaustion (951 open at a 1,024 soft limit) took the supervisor down for 11 hours → limits raised, FD headroom monitored. glibc arena fragmentation cost ~1 GB → jemalloc with decay tuning. 498 per-bot systemd services collapsed into one supervisor."
            uk: "Виснаження файлових дескрипторів (951 при soft-ліміті 1 024) поклало супервізор на 11 годин → ліміти підняті, запас FD під моніторингом. Фрагментація арен glibc з’їдала ~1 ГБ → jemalloc із тюнінгом decay. 498 systemd-сервісів на бота згорнуті в один супервізор."
        - title:
            en: "Quality gate"
            uk: "Гейт якості"
          body:
            en: "14,000+ RSpec examples, nearly two lines of test per line of code, four custom RuboCop cops, strict loading on by default, and an automated AI review of every pull request against an eight-point checklist."
