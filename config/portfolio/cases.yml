# RubyCoin · /work portfolio content
# Seven real projects. Bilingual: every translatable value is a { en:, uk: } pair.
# Strings may contain inline <b>, <i> and <code> — render with a sanitiser that
# allows exactly those three tags. No other HTML appears in this file.
# Order in this file is display order. `mark` is the printed number (01..07).

