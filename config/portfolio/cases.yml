    title:
      en: "RubyCoin"
      uk: "RubyCoin"
    tagline:
      en: "Free Rails lessons in Ukrainian, on a CMS I wrote — and the training ground where 19 contributors learned to ship reviewed code. You are on it right now."
      uk: "Безкоштовні уроки Rails українською на CMS, яку я написав — і полігон, де 19 контриб’юторів навчилися здавати код через рев’ю. Ви зараз на ньому."
    role:
      en: "Tech lead · architect · devops · rubyco.in"
      uk: "Tech lead · архітектор · devops · rubyco.in"
    stack:
      - "Rails 8.1 · Ruby 3.4"
      - "PostgreSQL 17"
      - "Hotwire · Stimulus"
      - "Propshaft · esbuild"
      - "pg_search · Globalize"
