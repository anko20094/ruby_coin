    scope_note:
      en: "<b>On the reach figure:</b> 33.8M is the sum of subscriber counts across managed channels, not unique people — 7.2M distinct Telegram accounts have passed through the platform. I state both because the first number flatters and the second is true."
      uk: "<b>Про цифру охвату:</b> 33,8 млн — це сума підписників керованих каналів, а не унікальні люди — через платформу пройшло 7,2 млн різних Telegram-акаунтів. Наводжу обидві, бо перша лестить, а друга правдива."
  - slug: "wardybot"
    mark: "03"
    own: true
    year: "2023—present"
    sector: "community platform"
    status: "built from zero · team up to 14"
    title:
      en: "WardyBot"
      uk: "WardyBot"
    tagline:
      en: "Moderation, anti-spam and game mechanics for large Telegram chats — 2.1 million users served from a single $24-a-month server."
      uk: "Модерація, антиспам та ігрові механіки для великих Telegram-чатів — 2,1 мільйона користувачів на одному сервері за $24 на місяць."
    role:
      en: "Tech lead · architect · product owner · devops"
      uk: "Tech lead · архітектор · product owner · devops"
    stack:
      - "Rails 8.1 · Ruby 3.4"
      - "PostgreSQL 18"
      - "Sidekiq 8 · Redis"
      - "RabbitMQ"
      - "Vue 3 · TypeScript · Inertia"
      - "OpenRouter · OpenAI"
    metrics:
      - value: "2.14M"
        label:
          en: "users across 2,488 chats"
          uk: "користувачів у 2 488 чатах"
      - value: "22.9M"
        label:
          en: "messages processed, peak 52k/day"
          uk: "оброблених повідомлень, пік 52 тис./день"
      - value: "×5.7"
        label:
          en: "growth in 11 months, same hardware"
          uk: "зростання за 11 місяців, те саме залізо"
      - value: "982"
        label:
          en: "days in production, uninterrupted"
          uk: "днів у продакшні, без перерв"
    plain:
      heading:
        en: "A chat with 28,000 people in it cannot be moderated by a human"
        uk: "Чат на 28 000 людей людина не вимодерує"
      body:
        - en: "Picture a Telegram chat with 28,000 people in it. Someone is spamming ads, someone is picking fights, someone is running bots. A human admin physically cannot keep up."
          uk: "Уявіть Telegram-чат на 28 000 людей. Хтось спамить рекламою, хтось лізе в конфлікт, хтось запускає ботів. Людина-адмін фізично не встигає."
        - en: "WardyBot takes that job: it catches spam, screens bots at the door, moderates toxicity and keeps the statistics. Then it does the other half — keeping people there. An in-chat currency, reputation, achievements, collectibles with a marketplace, duels, giveaways and an AI assistant give a community reasons to come back, and give its owner something to sell."
          uk: "WardyBot забирає цю роботу: ловить спам, фільтрує ботів на вході, модерує токсичність і веде статистику. А далі — друга половина продукту: втримати людей. Внутрішня валюта, репутація, ачівки, колекційні предмети з маркетплейсом, дуелі, розіграші й AI-асистент дають спільноті причини повертатися, а її власнику — що продавати."
        - en: "The number I care about is the ratio: two million users, one $24 virtual machine, 982 days without a break. Not because cheap hosting is a virtue in itself — because every architectural decision below was made under that constraint, and the constraint is what makes them interesting."
          uk: "Цифра, яка мені важлива, — це співвідношення: два мільйони користувачів, одна віртуалка за $24, 982 дні без перерви. Не тому, що дешевий хостинг сам собою чеснота, — а тому, що кожне архітектурне рішення нижче ухвалене під цим обмеженням, і саме обмеження робить їх цікавими."
    mine:
      - en: "<b>Designed the product and the architecture from a blank page</b> and made the first commit."
        uk: "<b>Спроєктував продукт і архітектуру з чистого аркуша</b> й зробив перший коміт."
      - en: "<b>Assembled and led a team of up to 14 developers</b> — and set the process they work in: ticket branches, review, CI, mandatory tests."
        uk: "<b>Зібрав і вів команду до 14 розробників</b> — і поставив процес, у якому вони працюють: тікет-бранчі, рев’ю, CI, обов’язкові тести."
      - en: "<b>Owned production alone:</b> all 196 deploys, the runbooks, the incident response."
        uk: "<b>Продакшн вів сам:</b> усі 196 деплоїв, ранбуки, реакція на інциденти."
      - en: "<b>Owned the business model:</b> subscriptions, two internal currencies, Telegram Stars payments with refunds — and <b>17 white-label bots</b> on the same core."
        uk: "<b>Володів бізнес-моделлю:</b> підписки, дві внутрішні валюти, оплати Telegram Stars із поверненнями — і <b>17 white-label ботів</b> на тому ж ядрі."
    engineering:
      heading:
        en: "One Rails process, N bots, four currencies and a ledger that cannot drift"
        uk: "Один Rails-процес, N ботів, чотири валюти й леджер, який не розсинхронізується"
      sub:
        en: "785 service objects, 48k lines of code against 107k lines of tests, one VPS with 2 vCPU and 3.8 GB of RAM."
        uk: "785 сервісних об’єктів, 48 тис. рядків коду проти 107 тис. рядків тестів, один VPS на 2 vCPU і 3,8 ГБ RAM."
      items:
        - title:
            en: "One core, many bots"
            uk: "Одне ядро, багато ботів"
          body:
            en: "One Rails process serves the main bot by webhook and N customer bots by pollers. Any service can raise a client for an arbitrary bot id straight from the database, with sessions isolated per bot · chat · user. <b>17 white-label bots in production.</b>"
            uk: "Один Rails-процес обслуговує головного бота через webhook і N клієнтських ботів через полери. Будь-який сервіс може підняти клієнта для довільного bot id прямо з бази, сесії ізольовані по bot · chat · user. <b>17 white-label ботів у продакшні.</b>"
        - title:
            en: "Aggregate, don’t archive"
            uk: "Агрегувати, а не архівувати"
          body:
            en: "<b>22.9M messages compressed into 1.48M counter rows</b> (user × room × day). A deliberate refusal to store per-message — which is why the database is 2.9 GB instead of ~300, and why the $24 server is still the right size."
            uk: "<b>22,9 млн повідомлень стиснуто в 1,48 млн рядків-лічильників</b> (юзер × чат × день). Свідома відмова зберігати кожне повідомлення — тому база 2,9 ГБ, а не ~300, і тому сервер за $24 досі правильного розміру."
        - title:
            en: "Immutable financial ledger"
            uk: "Незмінний фінансовий леджер"
          body:
            en: "Transactions cannot be deleted, and cannot be updated except for two types. <b>22 operation kinds, four currencies</b>, amount sign validated against type — <b>82,703 transactions, no balance drift.</b>"
            uk: "Транзакції не можна видаляти й не можна змінювати, крім двох типів. <b>22 види операцій, чотири валюти</b>, знак суми валідується проти типу — <b>82 703 транзакції без розсинхрону балансів.</b>"
        - title:
            en: "Reflective command router"
            uk: "Рефлективний роутер команд"
          body:
            en: "Instead of a route table the dispatcher discovers controllers by glob and maps a command to a method by reflection — a new command module is a new file, nothing else. Exactly what you want when fourteen people add commands in parallel. 63 commands, 298 callbacks."
            uk: "Замість таблиці роутів диспетчер знаходить контролери через glob і зіставляє команду з методом рефлексією — новий модуль команди це новий файл і більше нічого. Саме те, що потрібно, коли чотирнадцять людей додають команди паралельно. 63 команди, 298 колбеків."
        - title:
            en: "Moderation pipeline before routing"
            uk: "Модерація перед роутингом"
          body:
            en: "Nine validators in sequence; only the ones that must delete instantly run synchronously. Anti-spam expands <b>~70 homoglyphs into regex classes</b>, so <code>ПpNB1т</code> is still caught."
            uk: "Дев’ять валідаторів послідовно; синхронно виконуються лише ті, що мусять видалити негайно. Антиспам розкриває <b>~70 гомоглифів у regex-класи</b>, тож <code>ПpNB1т</code> усе одно ловиться."
        - title:
            en: "Cross-language RPC · AI billed at cost"
            uk: "Міжмовний RPC · AI за собівартістю"
          body:
            en: "Quote rendering lives in another service, in another language, on another server: request-reply over <b>federated RabbitMQ queues</b> with zlib+base64 transport. Upstream inference cost is read out of the provider response and converted into internal tokens, so pricing tracks the market instead of a hardcoded guess. Telegram file ids cached in Redis under versioned keys removed the most expensive part of outbound traffic."
            uk: "Рендер цитат живе в іншому сервісі, іншою мовою, на іншому сервері: request-reply через <b>федеровані черги RabbitMQ</b> з транспортом zlib+base64. Собівартість інференсу читається з відповіді провайдера й конвертується у внутрішні токени — ціна їде за ринком, а не за хардкодом. Кешування Telegram file id у Redis під версійованими ключами прибрало найдорожчу частину вихідного трафіку."
    quality:
      - value: "196"
        label:
          en: "zero-downtime deploys"
          uk: "деплоїв без простою"
      - value: "2.2:1"
        label:
          en: "tests to code · 5,130 examples"
          uk: "тестів до коду · 5 130 прикладів"
      - value: "2.9 GB"
        label:
          en: "database at 2.14M users"
          uk: "база при 2,14 млн юзерів"
      - value: "2 / 3.8"
        label:
          en: "vCPU / GB — the whole box"
          uk: "vCPU / ГБ — увесь сервер"
    scope_note:
      en: "<b>Engineering culture, since it is mine to answer for:</b> 107k lines of tests against 48k of code, no RuboCop todo file, a pre-commit gate on Ruby and TypeScript, CI on every push, AI review plus secret scanning. 196 zero-downtime deploys, all of them mine."
      uk: "<b>Інженерна культура — бо відповідати за неї мені:</b> 107 тис. рядків тестів проти 48 тис. коду, жодного RuboCop todo, pre-commit гейт на Ruby і TypeScript, CI на кожен пуш, AI-рев’ю плюс сканування секретів. 196 деплоїв без простою — усі мої."
  - slug: "leads"
    mark: "04"
    own: false
    year: "2022—2025"
    sector: "proptech · usa"
    status: "commercial · 38 contributors"
    title:
      en: "myHomeIQ · Leads"
      uk: "myHomeIQ · Leads"
    tagline:
      en: "The product customers log into and pay for — an eight-year Rails codebase where I owned the money, the permissions and the seam to the other service."
      uk: "Продукт, у який клієнти логіняться і за який платять — восьмирічна Rails-кодова база, де моїми були гроші, права доступу і шов між двома сервісами."
    role:
      en: "Senior Backend Engineer · 9th of 38 contributors"
      uk: "Senior Backend Engineer · 9-й з 38 контриб’юторів"
    stack:
      - "Ruby 3.3 · Rails 7.2"
      - "PostgreSQL · Scenic"
      - "Stripe"
      - "Pundit · Interactor"
      - "SendGrid"
      - "rswag / OpenAPI"
      - "RSpec · VCR"
    metrics:
      - value: "486"
        label:
          en: "public API operations across 426 paths"
          uk: "публічних API-операцій на 426 шляхах"
      - value: "193"
        label:
          en: "commits merged · 140 pull requests"
          uk: "комітів змерджено · 140 PR"
      - value: "110"
        label:
          en: "Jira tickets closed end to end"
          uk: "Jira-тікетів закрито наскрізно"
      - value: "9×9"
        label:
          en: "roles × plans in the permission matrix"
          uk: "ролей × планів у матриці прав"
    plain:
      heading:
        en: "I worked on the two places where a bug shows up on someone’s bank statement"
        uk: "Я працював у двох місцях, де баг видно у виписці з банку"
      body:
        - en: "This is the half of myHomeIQ that has customers in it. An agent uploads their past clients, and the platform sends every homeowner a monthly branded report — what the house is worth now, how much of the mortgage is paid off, what refinancing would save, what they could buy if they sold. The agent stays visible for years without lifting a finger."
          uk: "Це та половина myHomeIQ, у якій є клієнти. Агент завантажує своїх колишніх клієнтів, і платформа щомісяця надсилає кожному власнику будинку брендований звіт — скільки будинок коштує зараз, скільки іпотеки виплачено, що дало б рефінансування, що можна купити, якщо продати. Агент лишається на очах роками, не роблячи нічого."
        - en: "<b>Billing errors show up on a customer’s bank statement.</b> Subscriptions, plan upgrades, refunds, lockout for non-payment — there is no “almost right” here. <b>Permissions are a matrix, not a flag:</b> nine roles against nine plans, plus enterprise and white-label, down to rights on a single lead."
          uk: "<b>Помилки біллінгу видно у виписці клієнта.</b> Підписки, апгрейди планів, повернення, блокування за неоплату — тут не буває «майже правильно». <b>Права — це матриця, а не прапорець:</b> дев’ять ролей проти дев’яти планів, плюс enterprise і white-label, аж до прав на конкретний лід."
        - en: "And the two services share no database and no message broker, so consistency had to be designed rather than assumed. I wrote both sides of that integration — which is what someone does when they can see the whole system, not just their slice of it."
          uk: "А два сервіси не мають ні спільної бази, ні спільного брокера — тож консистентність треба було спроєктувати, а не припустити. Я написав обидві сторони цієї інтеграції: так робить той, хто бачить систему цілком, а не лише свою ділянку."
    mine:
      - en: "<b>Stripe billing</b> — charge-day logic, lockout and automatic unlock on payment, duplicate invoice suppression on upgrade."
        uk: "<b>Біллінг на Stripe</b> — логіка дня списання, блокування й автоматичне розблокування після оплати, гасіння дублікатів інвойсів при апгрейді."
      - en: "<b>Access control</b> across a 9-roles × 9-plans matrix, including a brand-new customer role threaded through every part of it."
        uk: "<b>Контроль доступу</b> в матриці 9 ролей × 9 планів, включно з новою роллю клієнта, протягнутою через усі її частини."
      - en: "<b>Both sides of the cross-service integration:</b> SSO, profile, partnership and licence sync, deletion webhooks."
        uk: "<b>Обидві сторони міжсервісної інтеграції:</b> SSO, синхронізація профілів, партнерств і ліцензій, вебхуки видалення."
      - en: "<b>Whole product verticals</b> taken from controller to documented endpoint — affordability, seller commission, combined partnerships, HELOC/HELOAN."
        uk: "<b>Цілі продуктові вертикалі</b> від контролера до документованого ендпоінта — affordability, комісія продавця, комбіновані партнерства, HELOC/HELOAN."
    engineering:
      heading:
        en: "Stripe’s awkward parts, a Pundit matrix, and a 6,256-line importer split"
        uk: "Незручні частини Stripe, матриця Pundit і розбір імпортера на 6 256 рядків"
      sub:
        en: "84k LOC, 2,272 classes, 38 contributors, 2,324 spec files, 8 Swagger specifications in the repository."
        uk: "84 тис. рядків, 2 272 класи, 38 контриб’юторів, 2 324 файли тестів, 8 Swagger-специфікацій у репозиторії."
      items:
        - title:
            en: "Stripe billing, the awkward parts"
            uk: "Stripe: саме незручні частини"
          body:
            en: "Charging on a <b>stored charge day</b> rather than the creation date; no subscription without a payment method; <b>lockout on non-payment and automatic unlock</b> once payment clears; duplicate invoice emails suppressed on plan upgrade; a cron that cancels unpaid reservations into trial. Built as <b>PaymentIntent / Invoice / Subscription adapters</b>, tested against recorded real Stripe responses."
            uk: "Списання за <b>збереженим днем оплати</b>, а не за датою створення; немає підписки без платіжного методу; <b>блокування за неоплату й автоматичне розблокування</b>, коли платіж проходить; гасіння дублікатів інвойс-листів при апгрейді; крон, що переводить неоплачені резервації в тріал. Зроблено як <b>адаптери PaymentIntent / Invoice / Subscription</b>, протестовані проти записаних реальних відповідей Stripe."
        - title:
            en: "A new role, threaded end to end"
            uk: "Нова роль, протягнута наскрізь"
          body:
            en: "Title-company users introduced across billing rights, report access, white label, enterprise limits and traffic control — alongside a refactor of the <b>Pundit policy hierarchy</b> that pulled shared rules up and cut duplication between roles. A permission regression is silent until it is a security incident, so every change shipped with a large spec matrix."
            uk: "Користувачі title-компаній додані через права біллінгу, доступ до звітів, white label, enterprise-ліміти й контроль трафіку — разом із рефакторингом <b>ієрархії політик Pundit</b>, який підняв спільні правила вгору й прибрав дублювання. Регресія в правах тиха, поки не стає інцидентом безпеки, тож кожна зміна йшла з великою матрицею тестів."
        - title:
            en: "Client-base imports · 6,256 lines"
            uk: "Імпорт клієнтських баз · 6 256 рядків"
          body:
            en: "My largest single commit in the repository split a monolithic CSV importer into <b>two inheritance hierarchies</b> — plain homeowners, and rows that already carry agent and lender emails — with separate validators, jobs and about 20 fixtures. Customer data arrives however the previous CRM exported it, so robustness beats elegance here."
            uk: "Мій найбільший одиничний коміт у репозиторії розділив монолітний CSV-імпортер на <b>дві ієрархії наслідування</b> — прості власники будинків і рядки, що вже несуть емейли агента й лендера — з окремими валідаторами, джобами і ~20 фікстурами. Дані приходять у тому вигляді, у якому їх експортувала попередня CRM, тож надійність важливіша за елегантність."
        - title:
            en: "Cross-service integration, both sides"
            uk: "Міжсервісна інтеграція, обидві сторони"
          body:
            en: "SSO and current-user resolution, agent connect/disconnect, synchronisation of avatars, partnerships, licences and external ids, deletion webhooks over callbacks, trial accounts blocked from intelligence, and ghost-user handling. No shared database, no shared broker — every guarantee is explicit."
            uk: "SSO і резолвінг поточного користувача, підключення/відключення агента, синхронізація аватарів, партнерств, ліцензій і зовнішніх id, вебхуки видалення через колбеки, блокування тріальних акаунтів від intelligence, обробка ghost-користувачів. Спільної бази немає, спільного брокера немає — кожна гарантія прописана явно."
        - title:
            en: "Email infrastructure"
            uk: "Інфраструктура листів"
          body:
            en: "Dynamic subject lines, an unsubscribe button broadcasting across several domains, per-category tracking, <b>IP pools</b>, and address validation through the suppression API behind a <b>seven-day blacklist cache</b> — the homeowner side of this product is measured in emails delivered, and a burned sending reputation takes months to repair."
            uk: "Динамічні теми листів, кнопка відписки, що розсилає подію на кілька доменів, трекінг за категоріями, <b>IP-пули</b> й валідація адрес через suppression API за <b>семиденним кешем блеклиста</b> — сторона власників будинків міряється доставленими листами, а спалену репутацію відправника відновлюють місяцями."
        - title:
            en: "Product verticals, whole slices"
            uk: "Продуктові вертикалі цілими шматками"
          body:
            en: "Affordability calculator and seller-commission APIs taken <code>controller → interactor → service → serializer → validator → Swagger → five spec files</code>. Combined partnerships with a custom query object; HELOC/HELOAN loan types; round-robin lead distribution for agent + lender pairs. rswag generates the spec from request specs, so no endpoint of mine shipped undocumented."
            uk: "API калькулятора доступності й комісії продавця, зроблені як <code>контролер → інтерактор → сервіс → серіалізатор → валідатор → Swagger → п’ять файлів тестів</code>. Комбіновані партнерства з власним query-об’єктом; типи позик HELOC/HELOAN; round-robin розподіл лідів для пар агент + лендер. rswag генерує специфікацію з request-тестів, тож жоден мій ендпоінт не пішов без документації."
    quality:
