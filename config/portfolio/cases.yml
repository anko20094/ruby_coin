          uk: "документованих API-операцій"
    scope_note:
      en: "<b>Scope, honestly.</b> Helm charts, Dockerfiles and CI pipelines were owned by dedicated people on this platform — I worked inside a Kubernetes/CircleCI environment rather than building it. My contribution is applied backend and data work. Every number here comes from git history at HEAD, not from memory."
      uk: "<b>Про межі — чесно.</b> Helm-чарти, Dockerfile і CI-пайплайни на цій платформі належали окремим людям — я працював у Kubernetes/CircleCI-оточенні, а не будував його. Мій внесок — прикладний бекенд і робота з даними. Усі цифри — з git-історії на HEAD, а не з пам’яті."
  - slug: "dna"
    mark: "02"
    own: true
    year: "2023—2026"
    sector: "content automation"
    status: "built from zero · team up to 6"
    title:
      en: "DNA"
      uk: "DNA"
    tagline:
      en: "A media business runs dozens of Telegram channels. This platform runs them for it — collecting, cleaning, rewriting, scheduling, publishing and billing, unattended."
      uk: "Медіабізнес веде десятки Telegram-каналів. Ця платформа веде їх за нього — збирає, чистить, переписує, планує, публікує й білить, без наглядача."
    role:
      en: "Tech lead · architect · PM · devops"
      uk: "Tech lead · архітектор · PM · devops"
    stack:
      - "Rails 8.1 · Ruby 3.4"
      - "PostgreSQL 18"
      - "TDLib / MTProto"
      - "pgvector · HNSW"
      - "Sidekiq 8 · Redis"
      - "pgbouncer"
      - "systemd · Capistrano"
    metrics:
      - value: "33.8M"
        label:
          en: "combined reach of managed channels"
          uk: "сукупний охват керованих каналів"
      - value: "10,418"
        label:
          en: "paying platform customers"
          uk: "платних клієнтів платформи"
      - value: "~23k"
        label:
          en: "posts through the pipeline daily"
          uk: "постів через пайплайн щодня"
      - value: "×20"
        label:
          en: "customer growth in 14 months"
          uk: "зростання клієнтів за 14 місяців"
    plain:
      heading:
        en: "By hand this is not hard — it is impossible"
        uk: "Руками це не складно — це неможливо"
      body:
        - en: "Thousands of media businesses live inside Telegram. One owner may hold dozens of channels and has to feed every one of them every day: find material, strip out somebody else’s ads, rewrite the text, schedule the post, greet new subscribers, sell ad slots, count the money."
          uk: "Тисячі медіабізнесів живуть у Telegram. Один власник може тримати десятки каналів і мусить щодня наповнювати кожен: знайти матеріал, вичистити чужу рекламу, переписати текст, поставити пост у розклад, привітати нових підписників, продати рекламні слоти, порахувати гроші."
        - en: "The owner connects their channels and sources once, sets the rules, and the platform takes over: around the clock, weekends included, with nobody at the console. Each customer even gets their own branded bot, created and maintained by the platform itself."
          uk: "Власник один раз підключає канали й джерела, задає правила — і платформа перебирає роботу на себе: круглу добу, включно з вихідними, без людини за консоллю. Кожен клієнт навіть отримує власного брендованого бота, якого платформа створює й обслуговує сама."
        - en: "<b>Why it is genuinely hard.</b> Telegram has no official API for this. The platform keeps a fleet of 61 real accounts on the low-level protocol — and Telegram can ban any of them for behaving oddly. So most of the engineering is not “ship a feature”, it is “do not break”: rate budgets, fingerprint separation, ban handling, session recovery — the system heals itself while the owner sleeps."
          uk: "<b>Чому це справді складно.</b> В Telegram немає офіційного API для такого. Платформа тримає парк із 61 живого акаунта на низькорівневому протоколі — і Telegram може забанити будь-який за дивну поведінку. Тож більшість інженерії тут — не «зробити фічу», а «не зламатися»: бюджети частоти, розділення відбитків, обробка банів, відновлення сесій — система лікує себе, поки власник спить."
    mine:
      - en: "<b>Designed and built the platform from zero</b> — architecture, product decisions, the roadmap, and 90% of merge commits."
        uk: "<b>Спроєктував і побудував платформу з нуля</b> — архітектура, продуктові рішення, роадмап і 90% merge-комітів."
      - en: "<b>Led a team of up to six</b> and owned 93% of production releases — 429 deploys."
        uk: "<b>Вів команду до шести людей</b> і випустив 93% продових релізів — 429 деплоїв."
      - en: "<b>Ran the platform migrations personally:</b> Python/Pyrogram → Ruby/TDLib, Rails 7.2 → 8.1, PostgreSQL 16 → 18."
        uk: "<b>Провів платформні міграції особисто:</b> Python/Pyrogram → Ruby/TDLib, Rails 7.2 → 8.1, PostgreSQL 16 → 18."
      - en: "<b>Built the billing and the per-customer bot factory</b> — the part that turns a tool into a business."
        uk: "<b>Зробив біллінг і фабрику ботів під кожного клієнта</b> — те, що перетворює інструмент на бізнес."
    engineering:
      heading:
        en: "A headless monolith with five routes and a self-healing userbot fleet"
        uk: "Headless-моноліт на п’ять роутів і userbot-парк, який лікує себе"
      sub:
        en: "200k lines of Ruby, 1,103 service objects, 44 tables, 8,289 RSpec examples, tests-to-code 1.75:1."
        uk: "200 тис. рядків Ruby, 1 103 сервісних об’єкти, 44 таблиці, 8 289 прикладів RSpec, тестів до коду 1.75:1."
      items:
        - title:
            en: "Headless monolith"
            uk: "Headless-моноліт"
          body:
            en: "No views, no JS build, no REST API — <b>five routes total</b>. The whole admin and user panel is a state machine inside Telegram: 200k lines of Ruby, 1,103 service objects, 44 tables."
            uk: "Ні в’юшок, ні JS-білду, ні REST API — <b>усього п’ять роутів</b>. Уся адмінка й панель користувача — це стейт-машина всередині Telegram: 200 тис. рядків Ruby, 1 103 сервісних об’єкти, 44 таблиці."
        - title:
            en: "Two delivery pipelines"
            uk: "Два пайплайни доставки"
          body:
            en: "Live mirroring (listener → clone per channel → autopost) and cursor-based drip backfill through source history. They receive differently-shaped data, so every capture bug is verified in both."
            uk: "Живе дзеркалення (слухач → клон на канал → автопост) і крапельний backfill історії джерела за курсором. Вони отримують дані різної форми, тож кожен баг захоплення перевіряється в обох."
        - title:
            en: "Userbot fleet on native TDLib"
            uk: "Userbot-парк на нативному TDLib"
          body:
            en: "Two sessions per account — one reads, one acts — all listeners under one supervisor with a reconciler that picks up new accounts without a restart. Join budgets, per-account device fingerprints, flood-wait pacing, membership reconciliation."
            uk: "Дві сесії на акаунт — одна читає, друга діє — усі слухачі під одним супервізором із реконсилером, що підхоплює нові акаунти без рестарту. Бюджети вступів, відбитки пристроїв на акаунт, витримка flood-wait, звірка членства."
        - title:
            en: "Semantic dedup & ad detection"
            uk: "Семантична дедуплікація й детект реклами"
          body:
            en: "<b>1536-dim embeddings inline in the content table</b> with an HNSW index; per-channel AI prompts composed at runtime from JSONB, so tuning needs no deploy."
            uk: "<b>1536-вимірні embeddings прямо в таблиці контенту</b> з HNSW-індексом; AI-промпти на канал збираються в рантаймі з JSONB, тож тюнінг не потребує деплою."
        - title:
            en: "Incidents worth reading"
            uk: "Інциденти, які варто прочитати"
          body:
            en: "FD exhaustion (951 open at a 1,024 soft limit) took the supervisor down for 11 hours → limits raised, FD headroom monitored. glibc arena fragmentation cost ~1 GB → jemalloc with decay tuning. 498 per-bot systemd services collapsed into one supervisor."
            uk: "Виснаження файлових дескрипторів (951 при soft-ліміті 1 024) поклало супервізор на 11 годин → ліміти підняті, запас FD під моніторингом. Фрагментація арен glibc з’їдала ~1 ГБ → jemalloc із тюнінгом decay. 498 systemd-сервісів на бота згорнуті в один супервізор."
        - title:
            en: "Quality gate"
            uk: "Гейт якості"
          body:
            en: "8,289 RSpec examples, tests-to-code 1.75:1, three custom RuboCop cops, strict loading on by default, and an automated AI review of every PR against a 13-point checklist."
            uk: "8 289 прикладів RSpec, тестів до коду 1.75:1, три власні RuboCop-копи, strict loading увімкнений за замовчуванням і автоматичне AI-рев’ю кожного PR за чеклистом із 13 пунктів."
    quality:
      - value: "429"
