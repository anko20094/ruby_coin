    metrics:
      - value: "89,030"
        label:
          en: "visits · 86,395 unique visitors"
          uk: "візитів · 86 395 унікальних"
      - value: "31k"
        label:
          en: "visits in 7.5 months of 2026, vs 24.8k in all of 2025"
          uk: "візитів за 7,5 міс. 2026 проти 24,8 тис. за весь 2025"
      - value: "19"
        label:
          en: "contributors led through review"
          uk: "контриб’юторів проведено через рев’ю"
      - value: "76ms"
        label:
          en: "home page render, 53 MB resident"
          uk: "рендер головної, 53 МБ resident"
    plain:
      heading:
        en: "No new article since February 2024 — and the traffic is still growing"
        uk: "Жодної нової статті з лютого 2024-го — а трафік досі росте"
      body:
        - en: "<b>You are reading this on it.</b> Good programming material in Ukrainian barely existed — beginners had to learn in someone else’s language. RubyCoin is a free bilingual platform of Rails lessons with its own publishing system, search and analytics, and this portfolio is a section of it."
          uk: "<b>Ви читаєте це на ньому.</b> Гарних матеріалів з програмування українською майже не існувало — початківцям доводилося вчитися чужою мовою. RubyCoin — це безкоштовна двомовна платформа уроків Rails із власною системою публікації, пошуком і аналітикою, а це портфоліо — її розділ."
        - en: "The number I am proudest of is not the traffic, it is the shape of it: <b>no new article has been published since February 2024, and visits are still growing</b> — 31,000 in seven and a half months of 2026 against 24,800 in the whole of 2025, almost entirely organic from Google. That is content quality and technical work compounding, not promotion."
          uk: "Цифра, якою я найбільше гордий, — не трафік, а його форма: <b>жодної нової статті не публікувалося з лютого 2024-го, а візити досі зростають</b> — 31 000 за сім із половиною місяців 2026-го проти 24 800 за весь 2025-й, майже повністю органіка з Google. Це складний відсоток від якості контенту й технічної роботи, а не промо."
        - en: "<b>The project as a school.</b> Nineteen contributors — mostly interns — passed through this codebase. I set the tasks, reviewed the pull requests and owned what reached production. The skill on display is not “wrote code”, it is “built a process in which other people write the code and it doesn’t fall apart”."
          uk: "<b>Проєкт як школа.</b> Дев’ятнадцять контриб’юторів — переважно інтернів — пройшли через цю кодову базу. Я ставив задачі, рев’ював pull request’и і відповідав за те, що дійшло до продакшну. Навичка, яку тут видно, — не «писав код», а «побудував процес, у якому код пишуть інші й це не розвалюється»."
    mine:
      - en: "<b>It is the only project here with no commercial pressure</b> — which makes it the honest sample of how I build when nobody is asking for a deadline."
        uk: "<b>Це єдиний проєкт тут без комерційного тиску</b> — тому він і є честним зразком того, як я будую, коли ніхто не просить дедлайн."
      - en: "<b>It is the mentoring evidence.</b> 19 people, every PR reviewed, production owned by me."
        uk: "<b>Це доказ менторства.</b> 19 людей, кожен PR прорев’ював, продакшн — на мені."
      - en: "<b>It is the Rails-craft sample:</b> Hotwire used where it earns its place, Turbo Drive deliberately off, upgrades carried live from Rails 7.0 to 8.1."
        uk: "<b>Це зразок Rails-ремесла:</b> Hotwire там, де він виправданий, Turbo Drive свідомо вимкнений, апгрейди проведені живими з Rails 7.0 до 8.1."
      - en: "<b>It compounds without me.</b> Two and a half years after the last article, the traffic curve is still going up."
        uk: "<b>Він накопичує без мене.</b> Через два з половиною роки після останньої статті крива трафіку досі йде вгору."
    engineering:
      heading:
        en: "AI translation that keeps the markup, and analytics with no counter to drift"
        uk: "AI-переклад, що не ламає розмітку, і аналітика без лічильника, який розсинхронізується"
      sub:
        en: "608 commits, CI with three linters and parallel specs, AI review with inline PR comments, 4 responses over 500 ms in 7 days of logs."
        uk: "608 комітів, CI з трьома лінтерами й паралельними тестами, AI-рев’ю з інлайн-комментарями в PR, 4 відповіді довші за 500 мс за 7 днів логів."
      items:
        - title:
            en: "AI translation that keeps the markup"
            uk: "AI-переклад, що зберігає розмітку"
          body:
            en: "Long articles don’t fit a model context, and naive slicing destroys HTML. So the document is <b>split along heading boundaries</b> into chunks under the token limit, each translated in <b>its own thread</b>, then reassembled by index — headings, lists and code blocks intact. An hour of manual work became one button."
            uk: "Довгі статті не влазять у контекст моделі, а наївне різання ламає HTML. Тому документ <b>ріжеться по межах заголовків</b> на куски під ліміт токенів, кожен перекладається <b>у власному потоці</b>, далі збирається за індексом — заголовки, списки й блоки коду цілі. Година ручної роботи стала однією кнопкою."
        - title:
            en: "Bilingual on three levels at once"
            uk: "Двомовність на трьох рівнях одночасно"
          body:
            en: "Locale in the URL scope, <b>thread-safe locale switching per request</b>, DB-level content translations — and <b>slug history</b>, so renaming a post never kills an indexed URL. That last one is why the organic traffic curve never has a cliff in it."
            uk: "Локаль у скоупі URL, <b>потокобезпечне перемикання локалі на кожен запит</b>, переклади контенту на рівні БД — і <b>історія слагів</b>, тож переназвання поста ніколи не вбиває проіндексований URL. Саме через останнє на кривій органічного трафіку немає обриву."
        - title:
            en: "Own analytics, ranking straight from events"
            uk: "Власна аналітика, рейтинг прямо з подій"
          body:
            en: "Server-side tracking with <b>24-hour view dedup</b>; “best posts” joins the event table on a JSONB key <b>behind a GIN index</b> — no denormalized counter to drift out of sync. Full-text search runs across translations, not the base table, so a Ukrainian query finds a Ukrainian article."
            uk: "Серверний трекінг із <b>дедуплікацією переглядів за 24 години</b>; «найкращі пости» джойняться з таблицею подій за JSONB-ключем <b>під GIN-індексом</b> — жодного денормалізованого лічильника, який роз’їдеться. Повнотекстовий пошук іде по перекладах, а не по базовій таблиці, тож український запит знаходить українську статтю."
        - title:
            en: "Search and statistics as objects"
            uk: "Пошук і статистика як об’єкти"
          body:
            en: "Statistics isolated as <b>five independently tested query objects</b>, and two-level authorization with a separate management policy namespace for admin versus moderator. When interns are writing the features, the seams have to be obvious."
            uk: "Статистика виділена у <b>п’ять незалежно протестованих query-об’єктів</b>, авторизація дворівнева з окремим неймспейсом політик управління для адміна й модератора. Коли фічі пишуть інтерни, шви мусять бути очевидними."
        - title:
            en: "Five image versions per upload"
            uk: "П’ять версій зображення на завантаження"
          body:
            en: "From 50×50 up to 1920×1080, generated on upload, and each view asks for the size it actually needs — the hero and the card do not download the same file. This is most of the reason the home page renders in <b>76 ms at 53 MB resident</b>."
            uk: "Від 50×50 до 1920×1080, генеруються при завантаженні, і кожен в’ю просить саме той розмір, який йому потрібен — герой і картка не тягнуть той самий файл. Це більша частина причини, чому головна рендериться за <b>76 мс при 53 МБ resident</b>."
        - title:
            en: "Upgrade discipline"
            uk: "Дисципліна апгрейдів"
          body:
            en: "Carried live through <b>Rails 7.0 → 8.1, Ruby 3.2 → 3.4, Sprockets/Webpacker → Propshaft + esbuild</b>, and the removal of the admin framework in favour of a custom panel. <b>Turbo Drive is deliberately off</b> — frames and streams applied where they earn it, not by default."
            uk: "Проведений живим через <b>Rails 7.0 → 8.1, Ruby 3.2 → 3.4, Sprockets/Webpacker → Propshaft + esbuild</b> і зняття адмін-фреймворку на користь власної панелі. <b>Turbo Drive свідомо вимкнений</b> — фрейми й стріми застосовані там, де вони себе виправдовують, а не за замовчуванням."
    quality:
      - value: "608"
        label:
          en: "commits"
          uk: "комітів"
      - value: "19"
        label:
          en: "contributors reviewed"
          uk: "контриб’юторів на рев’ю"
      - value: "53 MB"
        label:
          en: "resident memory"
          uk: "resident-пам’ять"
      - value: "4"
        label:
          en: "slow responses in 7 days"
          uk: "повільні відповіді за 7 днів"
    scope_note:
      en: "<b>Context, honestly:</b> this is a content site, not a high-load system — the engineering claim here is craft and process, not scale. And despite the name: not a cryptocurrency, not a token."
      uk: "<b>Контекст — чесно:</b> це контентний сайт, а не хайлоад — інженерна заявка тут про ремесло й процес, а не про масштаб. І попри назву: не криптовалюта й не токен."
    is_this_site: true
