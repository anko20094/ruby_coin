    title:
      en: "myHomeIQ · Intelligence"
      uk: "myHomeIQ · Intelligence"
    tagline:
      en: "The market-intelligence service behind a US proptech platform — it knows which agent sold what, where, with whom, and which deals got away."
      uk: "Сервіс ринкової аналітики за американською proptech-платформою — він знає, який агент що продав, де, з ким, і які угоди пішли повз нього."
    role:
      en: "Senior Backend Engineer · #2 of 15 contributors · joined on day three"
      uk: "Senior Backend Engineer · #2 з 15 контриб’юторів · у проєкті з третього дня"
