      uk: "<b>Про межі — чесно.</b> Це кодова база з 2018 року з 38 контриб’юторами — я 9-й за обсягом і не проєктував її. Що я справді можу заявити — володіння конкретними високоризиковими зонами всередині й те, що кожен доданий мною ендпоінт задокументований і покритий тестами."
  - slug: "imagemaker"
    mark: "05"
    own: true
    year: "2022—present"
    sector: "render service"
    status: "built from zero · team of 6 · 4 years live"
    title:
      en: "ImageMaker"
      uk: "ImageMaker"
    tagline:
      en: "Reply “quote” to any message and get a designed image back in about a second — and the same service quietly renders for a second product."
      uk: "Відповідай «цитата» на будь-яке повідомлення й отримуй готове зображення приблизно за секунду — і той самий сервіс тихо рендерить для другого продукту."
    role:
      en: "Tech lead · architect · devops"
      uk: "Tech lead · архітектор · devops"
    stack:
      - "Rails 8.1 · Ruby 3.4"
      - "ImageMagick 7 · Pango"
      - "RabbitMQ federation"
      - "Sidekiq · Redis"
      - "OpenRouter"
      - "jemalloc · systemd"
    metrics:
      - value: "430k"
        label:
          en: "users in 10,471 chats"
          uk: "користувачів у 10 471 чаті"
      - value: "225,667"
        label:
          en: "images rendered, peak 1,368/day"
          uk: "зображень відрендерено, пік 1 368/день"
      - value: "2"
        label:
          en: "products served by one codebase"
          uk: "продукти на одній кодовій базі"
      - value: "$12"
        label:
          en: "per month of hosting, all in"
          uk: "на місяць хостингу, разом з усім"
    plain:
      heading:
        en: "People quote each other with screenshots. This replaces that with one word."
        uk: "Люди цитують одне одного скриншотами. Це замінюється одним словом."
      body:
        - en: "In group chats people quote each other with screenshots — ugly, unreadable, and impossible to share outside the app. ImageMaker replaces that with one word: reply “quote” to any message and the bot returns a typeset image with the text, the author’s avatar, their name and the date on a matching background."
          uk: "У групових чатах люди цитують одне одного скриншотами — некрасиво, нечитабельно, і поза застосунком таким не поділишся. ImageMaker замінює це одним словом: відповідаєш «цитата» на будь-яке повідомлення, і бот повертає верстане зображення з текстом, аватаром автора, його ім’ям і датою на підібраному тлі."
        - en: "<b>The decision that doubled its value.</b> Instead of leaving it a standalone toy, I turned it into the shared rendering engine for the company’s other product. The same service now answers its own audience and three environments of a different bot on another physical server — one codebase, one team, two product lines."
          uk: "<b>Рішення, яке подвоїло цінність.</b> Замість того щоб лишити це окремою іграшкою, я зробив із нього спільний рендер-рушій для другого продукту компанії. Той самий сервіс тепер обслуговує власну аудиторію і три оточення іншого бота на іншому фізичному сервері — одна кодова база, одна команда, дві продуктові лінійки."
        - en: "Four years in production, +118,257 users in the last year alone, and the entire hosting bill is twelve dollars a month. That number is not a brag about frugality; it is the reason half the engineering below exists."
          uk: "Чотири роки в продакшні, +118 257 користувачів лише за останній рік, і весь рахунок за хостинг — дванадцять доларів на місяць. Ця цифра не про хвастощі економністю; вона про те, чому існує половина інженерії нижче."
    mine:
      - en: "<b>Text has to fit, always.</b> Any language, any length, an emoji-only message, one word 40 characters long — the layout can never overflow or look cramped."
        uk: "<b>Текст мусить вміститися завжди.</b> Будь-яка мова, будь-яка довжина, повідомлення з одних емодзі, одне слово на 40 символів — верстка не має права ні виїхати, ні виглядати затісною."
      - en: "<b>Formatting must survive.</b> Bold, links, spoilers, code — Telegram’s markup has to reappear in the rendered image, not disappear into plain text."
        uk: "<b>Форматування мусить вижити.</b> Жирний, посилання, спойлери, код — розмітка Telegram має з’явитися на зображенні, а не зникнути в плоскому тексті."
      - en: "<b>“Who said this” is genuinely ambiguous.</b> Forwards, hidden senders, channel posts, anonymous admins and service bots each resolve differently."
        uk: "<b>«Хто це сказав» — насправді неоднозначно.</b> Форварди, приховані відправники, пости каналів, анонімні адміни й сервісні боти визначаються по-різному."
      - en: "<b>1.9 GB of RAM.</b> Image rendering is the most memory-hungry thing you can do in Ruby, and it happens on a box smaller than a phone."
        uk: "<b>1,9 ГБ RAM.</b> Рендер зображень — найненажерливіша до пам’яті річ у Ruby, і вона відбувається на сервері, меншому за телефон."
    engineering:
      heading:
        en: "Typography by measurement, and 586 MB of render on a 1.9 GB box"
        uk: "Типографіка через вимірювання і 586 МБ рендеру на сервері з 1,9 ГБ"
      sub:
        en: "Dual-mode runtime, three binary searches over real Pango measurements, cascading LLM fallback, OOM kills driven to zero."
        uk: "Двохрежимний рантайм, три бінарні пошуки по реальних вимірах Pango, каскадний LLM-фолбек, OOM-кіли зведені до нуля."
      items:
        - title:
            en: "Dual-mode runtime"
            uk: "Двохрежимний рантайм"
          body:
            en: "One codebase answers Telegram webhooks <b>and</b> acts as an RPC consumer — correlation-id request-reply over RabbitMQ, images shipped as zlib-compressed base64. The same render path serves its own users and three environments of another product, so a bug fixed here is fixed twice."
            uk: "Одна кодова база відповідає на Telegram-вебхуки <b>і</b> працює як RPC-консюмер — request-reply за correlation-id через RabbitMQ, зображення передаються як zlib-стиснений base64. Той самий шлях рендеру обслуговує власних користувачів і три оточення іншого продукту, тож виправлений тут баг виправлений двічі."
        - title:
            en: "Asymmetric queue federation across two servers"
            uk: "Асиметрична федерація черг між двома серверами"
          body:
            en: "The render host pulls jobs from the app host and writes replies locally; the app host pulls them back. <b>No open HTTP ports between machines</b>, no direct coupling — and the common failure mode is documented for whoever is on call. A dead host degrades the feature instead of cascading into the other product."
            uk: "Рендер-хост забирає задачі з app-хоста й пише відповіді локально; app-хост забирає їх назад. <b>Жодних відкритих HTTP-портів між машинами</b>, жодної прямої зв’язності — і типовий режим відмови задокументований для того, хто на чергуванні. Мертвий хост деградує фічу, а не валить каскадом другий продукт."
        - title:
            en: "Typography by measurement, not heuristic"
            uk: "Типографіка через вимірювання, а не евристику"
          body:
            en: "<b>Three independent binary searches</b> over real Pango render measurements size the quote, the name and the date, bounded by a pre-tuned ceiling table with a fast path — plus a separate search so the longest single word cannot overflow the box. No magic font-size constants, and no “usually fits”."
            uk: "<b>Три незалежні бінарні пошуки</b> по реальних вимірах рендеру Pango підбирають розмір цитати, імені й дати, обмежені попередньо налаштованою таблицею максимумів зі швидким шляхом — плюс окремий пошук, щоб найдовше слово не виїхало за межі. Жодних магічних констант кегля й жодного «зазвичай вміщається»."
        - title:
            en: "586 MB of peak render on a 1.9 GB box"
            uk: "586 МБ пікового рендеру на 1,9 ГБ"
          body:
            en: "Layered <b>ImageMagick resource limits</b> so a pathological input cannot take the host down; <b>jemalloc arena tuning</b> because RMagick holds memory outside Ruby’s GC; disciplined image destruction in <b>every <code>ensure</code> block</b>; rendering moved out of the web process into Sidekiq. <b>OOM kills went to zero.</b>"
            uk: "Багатошарові <b>ліміти ресурсів ImageMagick</b>, щоб патологічний вхід не поклав хост; <b>тюнінг арен jemalloc</b>, бо RMagick тримає пам’ять поза GC Ruby; дисципліноване знищення зображень у <b>кожному блоці <code>ensure</code></b>; рендер винесено з веб-процесу в Sidekiq. <b>OOM-кіли зійшли до нуля.</b>"
        - title:
            en: "Cascading LLM fallback"
            uk: "Каскадний LLM-фолбек"
          body:
            en: "The bot picks the background itself: AI reads the quote and chooses a theme. <b>Four models are tried in order</b>, each in its own rescue, output validated against a whitelist — so no model failure can break a render and the user never sees an error. The AI is a nice-to-have wearing a seatbelt, not a dependency."
            uk: "Бот сам підбирає тло: AI читає цитату й вибирає тему. <b>Чотири моделі пробуються по черзі</b>, кожна у власному rescue, вихід валідується проти білого списку — тож жодна відмова моделі не ламає рендер, і користувач ніколи не бачить помилки. AI тут — приємний бонус у пасках безпеки, а не залежність."
        - title:
            en: "Formatting survives · author identity"
            uk: "Форматування виживає · особа автора"
          body:
            en: "Telegram entities become Pango markup: filtered by intersection with the quoted fragment, applied <b>in reverse order</b> so tag insertion doesn’t shift later indices, then escaped in three passes. Forwards, hidden senders, channel and supergroup posts, anonymous admins and service bots each resolve differently — with a fallback chain down to one of 17 placeholder avatars and a circular crop drawn as a mask."
            uk: "Ентіті Telegram перетворюються в Pango-розмітку: фільтруються перетином із цитованим фрагментом, застосовуються <b>у зворотному порядку</b>, щоб вставка тегів не зсувала наступні індекси, далі — екранування в три проходи. Форварди, приховані відправники, пости каналів і супергруп, анонімні адміни й сервісні боти визначаються по-різному — з ланцюжком фолбеків аж до одного з 17 плейсхолдер-аватарів і круглим кропом через маску."
    quality:
      - value: "+118,257"
        label:
          en: "users in the last year"
          uk: "користувачів за рік"
      - value: "0"
        label:
          en: "OOM kills after tuning"
          uk: "OOM-кілів після тюнінгу"
      - value: "18,501"
        label:
          en: "largest chat"
          uk: "найбільший чат"
      - value: "179"
        label:
          en: "examples · VCR-backed CI"
          uk: "прикладів · CI на VCR"
    scope_note:
      en: "<b>Worth stating:</b> the interesting engineering here is not scale — it is doing image rendering, LLM calls and cross-server RPC inside twelve dollars a month without the user ever seeing a failure."
      uk: "<b>Варто сказати прямо:</b> цікава інженерія тут не в масштабі — а в тому, щоб робити рендер зображень, виклики LLM і міжсерверний RPC у межах дванадцяти доларів на місяць так, щоб користувач ніколи не побачив збою."
  - slug: "chatgpt"
    mark: "06"
    own: true
    year: "2023—present"
    sector: "ai assistant"
    status: "built from zero · technical lead & co-founder"
    title:
      en: "ChatGPT Bot"
      uk: "ChatGPT Bot"
    tagline:
      en: "A Ukrainian-language AI assistant in Telegram with a paid tier that actually collects money — 15,000 orders of it."
      uk: "Україномовний AI-асистент у Telegram із платним тарифом, який реально збирає гроші — 15 000 замовлень."
    role:
      en: "Technical lead & co-founder · full-stack design and implementation"
      uk: "Технічний лід і співзасновник · повний цикл"
    stack:
      - "Rails 7.1 · Ruby 3.3"
      - "PostgreSQL"
      - "Sidekiq · concurrency 300"
      - "OpenAI"
      - "Fondy recurring"
      - "Capistrano"
    metrics:
      - value: "289k"
        label:
          en: "users"
          uk: "користувачів"
      - value: "873k"
        label:
          en: "AI responses across 219k sessions"
          uk: "AI-відповідей у 219 тис. сесій"
      - value: "15k"
        label:
          en: "paid orders, recurring"
          uk: "платних замовлень, з автопродовженням"
      - value: "222k"
        label:
          en: "referral events paid out"
          uk: "реферальних подій виплачено"
    plain:
      heading:
        en: "In 2023, most Ukrainians simply could not sign up for a Western AI service"
        uk: "У 2023-му більшість українців просто не могла зареєструватися в західному AI-сервісі"
      body:
        - en: "Cards were declined, phone numbers rejected, the interface was in English. This bot removed all of that: open Telegram, ask a question in Ukrainian, get an answer. Free every day up to a limit, paid if you need more."
          uk: "Картки не проходили, номери телефонів не приймалися, інтерфейс був англійською. Цей бот прибрав усе це: відкрив Telegram, спитав українською, отримав відповідь. Безкоштовно щодня до ліміту, платно — якщо треба більше."
        - en: "It is deliberately a small product with one job, and it is the clearest commercial proof I can show: <b>289,000 people used it, 15,000 of them paid, and the money keeps arriving through automatic renewals.</b> Nobody sends an invoice, nobody reconciles a spreadsheet — the product bills itself."
          uk: "Це свідомо маленький продукт з однією задачею, і це найясніший комерційний доказ, який я можу показати: <b>289 000 людей ним скористалися, 15 000 із них заплатили, і гроші продовжують приходити через автоматичні продовження.</b> Ніхто не виставляє інвойси, ніхто не зводить таблиці — продукт білить сам себе."
        - en: "<b>A detail I like.</b> AI answers are slow, and silence feels broken. So the bot keeps typing — literally: a parallel thread pings the “typing” indicator every seven seconds for the whole duration of the response, so the chat never looks dead."
          uk: "<b>Деталь, яка мені подобається.</b> AI-відповіді повільні, а тишу користувач читає як «зламалося». Тому бот увесь час «друкує» — буквально: паралельний потік пінгує індикатор набору кожні сім секунд протягом усієї відповіді, тож чат ніколи не виглядає мертвим."
    mine:
      - en: "<b>Recurring payments end to end</b> — payment-token storage, a daily autopay worker, callback handling with status verification before anything is credited."
        uk: "<b>Регулярні платежі наскрізно</b> — зберігання платіжного токена, щоденний autopay-воркер, обробка колбеків із перевіркою статусу перед зарахуванням."
      - en: "<b>Freemium mechanics that survive abuse:</b> four paid durations plus request packs, a daily free allowance, and a 300-second duplicate-request throttle."
        uk: "<b>Freemium-механіки, що витримують зловживання:</b> чотири платні тривалості плюс пакети запитів, щоденний безкоштовний ліміт і 300-секундний тротлінг дублікатів."
      - en: "<b>Referral accounting:</b> a 15% bonus credited on every purchase by a referred user — <b>222,000 events settled</b> without manual reconciliation."
        uk: "<b>Реферальний облік:</b> 15% бонусу з кожної покупки залученого користувача — <b>222 000 подій зведено</b> без ручної роботи."
      - en: "<b>Nothing waits for a human.</b> Autopay, daily free-request resets and maintenance all run on the scheduler."
        uk: "<b>Ніщо не чекає людини.</b> Autopay, щоденні скидання безкоштовних запитів і обслуговування — усе на планувальнику."
    engineering:
      heading:
        en: "Threads for perceived latency, sessions for context, the scheduler for everything else"
        uk: "Потоки для відчуття швидкості, сесії для контексту, планувальник для решти"
      sub:
        en: "Sidekiq tuned to 300 workers to hold peak traffic; payments, throttling and referrals reconciled without human involvement."
        uk: "Sidekiq на 300 воркерів, щоб тримати піки; платежі, тротлінг і реферали зводяться без участі людини."
      items:
        - title:
            en: "Threaded UX pattern"
            uk: "Патерн UX на потоках"
          body:
            en: "The API call and the typing-indicator loop run as <b>concurrent threads</b>, pinging every seven seconds for the full response duration. Perceived latency is a product problem solved in the product layer — the model is not going to get faster because you wished for it."
            uk: "Виклик API і цикл індикатора набору працюють як <b>паралельні потоки</b>, пінгуючи кожні сім секунд протягом усієї відповіді. Відчуття затримки — продуктова проблема, вирішена на продуктовому шарі: модель не стане швидшою від того, що вам цього хочеться."
        - title:
            en: "Context window per session"
            uk: "Контекстне вікно на сесію"
          body:
            en: "The last five question/answer pairs are carried in an ordered structure <b>scoped to the chat session, not globally to the user</b> — so two parallel conversations don’t contaminate each other. Cheap to compute, and it is the difference between “the bot remembers” and “the bot is confused”."
            uk: "Останні п’ять пар «питання/відповідь» тримаються в упорядкованій структурі, <b>прив’язаній до сесії чату, а не глобально до користувача</b> — тож дві паралельні розмови не забруднюють одна одну. Дешево в обчисленні, і саме це різниця між «бот пам’ятає» і «бот заплутався»."
        - title:
            en: "Recurring payments end to end"
            uk: "Регулярні платежі наскрізно"
          body:
            en: "Payment-token storage, a <b>daily autopay worker at a fixed hour</b>, and callback handling with <b>status verification before anything is credited</b>. Money code gets the same rule as everywhere else: never trust the callback, verify the state."
            uk: "Зберігання платіжного токена, <b>щоденний autopay-воркер у фіксовану годину</b> і обробка колбеків із <b>перевіркою статусу перед будь-яким зарахуванням</b>. До грошового коду те саме правило, що й усюди: не вір колбеку, перевір стан."
        - title:
            en: "Freemium mechanics"
            uk: "Freemium-механіки"
          body:
            en: "Four paid durations plus request packs, a daily free-request allowance, and a <b>300-second duplicate-request throttle</b> to stop accidental double spend. Users hammer the button when an answer is slow — the throttle exists because of that, not because of a threat model."
            uk: "Чотири платні тривалості плюс пакети запитів, щоденний безкоштовний ліміт і <b>300-секундний тротлінг дублікатів</b>, щоб не було випадкового подвійного списання. Користувачі довбають кнопку, коли відповідь повільна — тротлінг існує через це, а не через модель загроз."
        - title:
            en: "Referral accounting"
            uk: "Реферальний облік"
          body:
            en: "A <b>15% bonus credited on every purchase made by a referred user</b>, tracked per account — <b>222,000 referral events settled</b> without manual reconciliation. Referral logic is where money quietly leaks; this one balances on its own."
            uk: "<b>15% бонусу з кожної покупки залученого користувача</b>, облік по акаунтах — <b>222 000 реферальних подій зведено</b> без ручної звірки. Реферальна логіка — типове місце, де тихо течуть гроші; ця зводиться сама."
        - title:
            en: "Load shape · operator tooling"
            uk: "Форма навантаження · інструменти оператора"
          body:
            en: "Sidekiq tuned to <b>300 workers</b> to hold peak traffic, since most of the work is waiting on an upstream API rather than burning CPU. Plus an admin panel for statistics, broadcasts, bans and the admin roster — so running the product does not require a console."
            uk: "Sidekiq налаштований на <b>300 воркерів</b>, щоб тримати піки — бо більшість роботи це очікування зовнішнього API, а не CPU. Плюс адмінка для статистики, розсилок, банів і складу адмінів — щоб вести продукт без консолі."
    quality:
      - value: "873k"
        label:
          en: "AI responses served"
          uk: "AI-відповідей віддано"
      - value: "300"
        label:
          en: "Sidekiq concurrency"
          uk: "конкурентність Sidekiq"
      - value: "7s"
        label:
          en: "typing ping interval"
          uk: "інтервал пінгу набору"
      - value: "3+"
        label:
          en: "years in production"
          uk: "роки в продакшні"
    scope_note:
      en: "<b>Stated plainly:</b> this is the least architecturally ambitious project here and the most commercially direct one. I include it because “I have shipped a product that takes money from strangers and renews it automatically” is a different claim from “I have shipped a product”."
      uk: "<b>Скажу прямо:</b> це найменш архітектурно амбітний проєкт тут і найпряміший комерційно. Я включаю його, бо «я зробив продукт, який бере гроші в незнайомців і продовжує підписку сам» — це інша заява, ніж «я зробив продукт»."
  - slug: "rubycoin"
    mark: "07"
