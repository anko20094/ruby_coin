# RubyCoin · who worked on what
#
# A contribution belongs to the PROJECT, not to the person — that is why it lives here
# and not in people.yml. The person page is composed by querying this file for their id,
# so a contribution is written once and can never drift between two pages.
#
# Keys are case slugs from cases.yml. `person` is an id from people.yml.
#
# `solo: true` renders as a statement ("Solo — the whole stack"), never as an empty team
# block. Only the two myHomeIQ cases are solo — everything else has a named team. `outside:` is the honest note for commercial work: the wider team existed but was
# the client's, not this studio's. Do not drop it — on those two cases the case page itself
# already prints its own — "9th of 34 contributors" on leads, "#2 / 14" on intelligence — and the team block must agree with it.
#
# `did:` is two lines. Not three, not a paragraph. Role + period + two lines is the whole
# format, and it is what keeps six people on one screen without inflation.

contributions:
  intelligence:
    - person: "danyil"
      solo: true
      role: { en: "Senior Backend Engineer", uk: "Senior Backend Engineer" }
      period: "2023—2026"
