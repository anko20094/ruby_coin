# ─────────────────────────────────────────────────────────────────────────────
# not_work
#
# This block used to be one five-column strip on the home page, attributed to the
# studio as a whole. It moved here because a studio does not play volleyball on
# Tuesdays — one specific person does.
#
# It is optional and renders only when present — danyil, oleksii, natalia and claude have
# one today.
#
# Each entry is `{ icon, label: {en, uk}, detail: {en, uk} }`; `detail` is OPTIONAL.
# It was briefly a flat ["label", "detail", "emoji"] tuple, which made this the one
# untranslated block on an otherwise fully Ukrainian person page — and the labels came
# from the people themselves, in Ukrainian. Never store a user-visible string here in
# one language.
#
# `detail` is filled in only where the person gave one; when absent the mono line is not rendered at all,
# so "ігри" stands alone rather than sitting above a blank row. Ask before inventing one.

