# RubyCoin · people
#
# A person record belongs to the person. It is their CV and nothing else — what they
# did on a given project lives in `team.yml`, keyed by project.
#
# Bilingual: every translatable value is a { en:, uk: } pair. That includes the parts that look
# like data — a contact row's key, a stack item, a period's open end — wherever they are prose
# rather than a proper noun: "Ruby on Rails" is the same word twice, "merge rights" is not. A
# bare string is still allowed and reads the same in both languages.
# Strings may contain inline <b>, <i> and <code> only — render through the same sanitiser as
# cases.yml.
#
# Three states exist, and two of them announce themselves:
#   full         — real content (danyil, claude)
#   placeholder  — `placeholder: true`; real role and real project work, invented dates,
#                  employers, contacts and education. Prints a ruby dashed banner on the
#                  page and a `PLACEHOLDER` chip in the roster. Written so the filled
#                  layout could be judged before the real CVs arrive.
#                  ⚠️ before launch: grep -n '^ *placeholder: true' — one record, an alumnus.
#   draft        — `cv: null`; nothing invented at all. A new hire lands in this state on
#                  day one, and so does anyone whose CV nobody here can keep honest.
#
# `cv: null` is a real, shippable state. It means nobody has filled this CV in yet,
# and the page says so instead of guessing a career for a named colleague. The person
# still appears in the roster and still shows their project contributions, because
# those are written by the project lead and are accurate.
#
# `updated:` is the staleness guard. A CV without a date, or with a date more than a
# year old, renders the "CV DRAFT" chip in the roster. Do not remove that chip — a
# stale CV is worse than an absent one. Only the crew needs one.
#
#
# `status:` is how someone joins and leaves. It is one word, and it is the only edit any of
# those things needs:
#
#   active   the default, and what `status:` being absent means. On the crew: /team, the
#            studio, the home strip, the search palette, and the team block of every case
#            they are credited on.
#
#   alumni   off the crew, still credited. Their rows in team.yml keep rendering on the case
#            pages, and their name appears in the alumni list on /studio. Leaving a studio
#            does not unwrite the code.
#
#   hidden   off the site entirely. The record stays, the rows in team.yml stay, the person
#            page 404s and the credits stop rendering. This is the switch: taking someone
#            down is a word rather than a deletion, the diff says what happened, and putting
#            them back is the same word again.
#
# `contact:` on someone else's record is GitHub and nothing else. Their CV may carry an email,
# a phone and a LinkedIn; this page is public and scrapeable, and handing over a colleague's
# direct channels is not the owner's to do. The owner's own contacts are his own call and live
# in cv.yml.
#
# An alumnus owes this file a name and nothing else. Demanding a role and a blurb from someone
# who has left is how a file like this starts holding invented copy about real people. A record
# with neither a CV nor a contribution prints as a name with no link, because the page behind
# that link would have to be invented.
#
# `rake team:check` is the fast gate — every rule the pages rely on, in under a second, with a
# non-zero exit. `rake team:who` prints who is in what state and on which projects.
#
# Order in this file is display order, for the crew and for the alumni alike.

