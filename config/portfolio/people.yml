      uk: "Шість років Rails у продакшні. Перший коміт у п’яти з семи проєктів тут — його."
    # The one indirection in this file: his CV is the document in cv.yml, which is also
    # what /cv renders. Load it from there rather than duplicating it here.
    cv_file: "cv.yml"
    # No `updated:` here: his CV is cv.yml, and so is its date. See Person#updated.
    # Optional. Renders as the last block on the person page. Omit it rather than
