      uk: 'Це свідомо маленький продукт з однією задачею, і це найясніший комерційний доказ, який ми можемо показати: <b>289 000 людей ним скористалися, продукт прийняв 15 000 платних замовлень, і гроші продовжують приходити через автоматичні продовження.</b> Ніхто не виставляє інвойси, ніхто не зводить таблиці — продукт сам виставляє рахунки.'
