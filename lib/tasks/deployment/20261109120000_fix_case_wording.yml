dna:
  scope_note:
    from:
      en: "<b>On the reach figure:</b> 33M+ is the sum of subscriber counts across managed channels, not unique people — around 7M distinct Telegram accounts have passed through the platform. I state both because the first number flatters and the second is true."
      uk: "<b>Про цифру охоплення:</b> 33 млн+ — це сума підписників керованих каналів, а не унікальні люди — через платформу пройшло близько 7 млн різних Telegram-акаунтів. Наводжу обидві, бо перша лестить, а друга правдива."
    to:
      en: "<b>On the reach figure:</b> 33M+ is the sum of subscriber counts across managed channels, not unique people — around 7M distinct Telegram accounts have passed through the platform. We state both because the first number flatters and the second is true."
